[project]
name = "llm-probe"
version = "0.1.0"
description = "Benchmark tool for local LLMs — coding tasks, pass@k, speed metrics"
readme = "README.md"
authors = [
    { name = "Illia Piskurov", email = "piskryov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "httpx[http2]>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
llm-probe = "llm_probe.cli:app"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.uv.env]
PYTHONUTF8 = "1"
