<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden}
#game-container{position:relative;width:560px;height:560px;border-radius:16px;box-shadow:0 0 40px rgba(0,255,136,.15),inset 0 0 80px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;right:0;padding:24px;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:600;z-index:2}
#score{color:#00ff88;text-shadow:0 0 12px rgba(0,255,136,.5)}
#level{color:#88ccff;text-shadow:0 0 12px rgba(136,204,255,.5)}
#controls-hint{font-size:12px;color:#556677;letter-spacing:.5px}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;border-radius:16px;transition:opacity .3s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:42px;color:#00ff88;text-shadow:0 0 30px rgba(0,255,136,.4);margin-bottom:8px;letter-spacing:2px}
#overlay .subtitle{color:#8899aa;font-size:14px;margin-bottom:32px}
#overlay .final-score{font-size:28px;color:#00ff88;text-shadow:0 0 20px rgba(0,255,136,.3);margin-bottom:24px}
#overlay button{padding:14px 48px;font-size:17px;font-weight:700;background:linear-gradient(135deg,#00ff88,#00cc66);color:#0a0a12;border:none;border-radius:10px;cursor:pointer;transition:all .2s;letter-spacing:1px}
#overlay button:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(0,255,136,.4)}
#overlay button:active{transform:scale(.97)}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
.pulse-text{animation:pulse 2s infinite}
</style>
</head>
<body>

<div id="game-container">
  <div id="ui">
    <span id="score">Счёт: 0</span>
    <span id="level">Уровень: 1</span>
    <span id="controls-hint">↑↓←→ или WASD</span>
  </div>
  <canvas id="game"></canvas>

  <div id="overlay">
    <h1 class="pulse-text">ЗМЕЙКА</h1>
    <p class="subtitle">Собери еду • Не впирайтесь в стены или себя!</p>
    <button id="start-btn">Начать игру</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const startBtn = document.getElementById('start-btn');

canvas.width = 560;
canvas.height = 560;

const GRID_SIZE = 20;
const TILE_COUNT = canvas.width / GRID_SIZE; // 28

let snake = [];
let food = { x: 0, y: 0 };
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let score = 0;
let level = 1;
let gameRunning = false;
let gameOver = false;
let lastTime = 0;
let tickInterval = 150; // ms per tick
let particles = [];

function resetGame() {
  const mid = Math.floor(TILE_COUNT / 2);
  snake = [
    { x: mid, y: mid },
    { x: mid - 1, y: mid },
    { x: mid - 2, y: mid }
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  level = 1;
  tickInterval = 150;
  particles = [];
  placeFood();
  updateUI();
}

function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  let attempts = 0;
  do {
    food.x = Math.floor(Math.random() * TILE_COUNT);
    food.y = Math.floor(Math.random() * TILE_COUNT);
    attempts++;
  } while (occupied.has(`${food.x},${food.y}`) && attempts < 1000);
}

function updateUI() {
  scoreEl.textContent = `Счёт: ${score}`;
  levelEl.textContent = `Уровень: ${level}`;
}

function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x * GRID_SIZE + GRID_SIZE / 2,
      y: y * GRID_SIZE + GRID_SIZE / 2,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      size: 2 + Math.random() * 3,
      color: color
    });
  }
}

function update(dt) {
  if (!gameRunning || gameOver) return;

  const elapsed = dt - lastTick;
  if (elapsed < tickInterval) return;
  lastTick = dt;

  direction = nextDirection;

  const head = snake[0];
  const newHead = { x: head.x + direction.x, y: head.y + direction.y };

  // Wall collision
  if (newHead.x < 0 || newHead.x >= TILE_COUNT || newHead.y < 0 || newHead.y >= TILE_COUNT) {
    endGame();
    return;
  }

  // Self collision
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
      endGame();
      return;
    }
  }

  snake.unshift(newHead);

  // Eat food
  if (newHead.x === food.x && newHead.y === food.y) {
    score += 10;
    level = Math.floor(score / 50) + 1;
    tickInterval = Math.max(60, 150 - (level - 1) * 8);
    spawnParticles(food.x, food.y, '#ff4466', 12);
    placeFood();
    updateUI();
  } else {
    snake.pop();
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= TILE_COUNT; i++) {
    const pos = i * GRID_SIZE;
    ctx.beginPath();
    ctx.moveTo(pos, 0);
    ctx.lineTo(pos, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, pos);
    ctx.lineTo(canvas.width, pos);
    ctx.stroke();
  }

  // Food glow
  const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
  const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
  const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
  const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, GRID_SIZE);
  glow.addColorStop(0, `rgba(255,68,102,${pulse * 0.4})`);
  glow.addColorStop(1, 'rgba(255,68,102,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(food.x * GRID_SIZE - GRID_SIZE, food.y * GRID_SIZE - GRID_SIZE, GRID_SIZE * 3, GRID_SIZE * 3);

  // Food
  const fSize = GRID_SIZE - 4;
  const fOff = (GRID_SIZE - fSize) / 2;
  ctx.fillStyle = '#ff4466';
  ctx.shadowColor = '#ff4466';
  ctx.shadowBlur = 15;
  roundRect(ctx, food.x * GRID_SIZE + fOff, food.y * GRID_SIZE + fOff, fSize, fSize, 4);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake body
  for (let i = snake.length - 1; i >= 0; i--) {
    const seg = snake[i];
    const t = i / snake.length;
    const r = Math.round(0 + t * 0);
    const g = Math.round(255 - t * 80);
    const b = Math.round(136 - t * 40);

    const sx = seg.x * GRID_SIZE + 1;
    const sy = seg.y * GRID_SIZE + 1;
    const ss = GRID_SIZE - 2;

    if (i === 0) {
      // Head
      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 20;
      roundRect(ctx, sx, sy, ss, ss, 5);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Eyes
      const eyeSize = 3;
      const eyeOffX = direction.x * 4;
      const eyeOffY = direction.y * 4;
      const eye1x = sx + ss/2 - 5 + eyeOffX, eye1y = sy + ss/2 - 5 + eyeOffY;
      const eye2x = sx + ss/2 + 5 + eyeOffX, eye2y = sy + ss/2 - 5 + eyeOffY;

      ctx.fillStyle = '#0a0a12';
      ctx.beginPath();
      ctx.arc(eye1x, eye1y, eyeSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eye2x, eye2y, eyeSize, 0, Math.PI * 2);
      ctx.fill();

      // Pupil highlight
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(eye1x + direction.x, eye1y + direction.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eye2x + direction.x, eye2y + direction.y, 1.5, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // Body segments with gradient
      const grad = ctx.createLinearGradient(sx, sy, sx + ss, sy + ss);
      grad.addColorStop(0, `rgb(${r},${g},${b})`);
      grad.addColorStop(1, `rgb(${Math.max(0,r-20)},${Math.max(0,g-20)},${Math.max(0,b-20)})`);
      ctx.fillStyle = grad;
      roundRect(ctx, sx, sy, ss, ss, 3 - i * 0.15);
      ctx.fill();

      // Subtle border
      ctx.strokeStyle = `rgba(0,255,136,${0.1 + t * 0.15})`;
      ctx.lineWidth = 0.5;
      roundRect(ctx, sx, sy, ss, ss, 3 - i * 0.15);
      ctx.stroke();
    }
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Game over flash
  if (gameOver) {
    ctx.fillStyle = 'rgba(255,68,102,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function endGame() {
  gameOver = true;
  gameRunning = false;
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = 'ИГРОК ПОТЕРЯН!';
  overlay.querySelector('.subtitle').textContent = `Финальный счёт: ${score}`;
  overlay.querySelector('.final-score').style.display = 'block';
}

function startGame() {
  resetGame();
  gameRunning = true;
  gameOver = false;
  lastTick = performance.now();
  overlay.classList.add('hidden');
}

// Input handling
document.addEventListener('keydown', (e) => {
  if (!gameRunning && !gameOver) return;

  const key = e.key.toLowerCase();

  // Start game with any arrow/WASD when not running and no game over
  if (!gameRunning && !gameOver && (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(key))) {
    startGame();
    return;
  }

  // Game over restart with Enter or Space
  if (gameOver && (key === 'enter' || key === ' ')) {
    e.preventDefault();
    startGame();
    return;
  }

  if (!gameRunning) return;

  switch (key) {
    case 'arrowup':
    case 'w':
      if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
      break;
    case 'arrowdown':
    case 's':
      if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
      break;
    case 'arrowleft':
    case 'a':
      if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
      break;
    case 'arrowright':
    case 'd':
      if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
      break;
  }

  e.preventDefault();
});

startBtn.addEventListener('click', startGame);

// Game loop
function gameLoop(timestamp) {
  const dt = timestamp || performance.now();
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
