<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Змейка</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #1a1a2e;
  font-family: 'Courier New', monospace;
  color: #eee;
}
h1 { margin-bottom: 10px; font-size: 1.6rem; letter-spacing: 2px; }
#score { font-size: 1.2rem; margin-bottom: 12px; }
canvas {
  border: 3px solid #4ecca3;
  border-radius: 4px;
  background: #16213e;
}
#msg {
  margin-top: 14px;
  font-size: 1rem;
  color: #4ecca3;
  min-height: 1.4em;
}
</style>
</head>
<body>
<h1>ЗМЕЙКА</h1>
<div id="score">Счёт: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="msg">Стрелки / WASD — движение</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const msgEl = document.getElementById('msg');

  const GRID = 20;
  const CELL = canvas.width / GRID;
  const SPEED = 120;

  let snake, dir, nextDir, food, score, alive, timer;

  function init() {
    snake = [{ x: 10, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    alive = true;
    placeFood();
    updateScore();
    msgEl.textContent = 'Стрелки / WASD — движение';
    clearInterval(timer);
    timer = setInterval(tick, SPEED);
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateScore() {
    scoreEl.textContent = 'Счёт: ' + score;
  }

  function tick() {
    if (!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return gameOver();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      updateScore();
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    msgEl.textContent = 'GAME OVER — нажмите Enter для перезапуска';
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // food
    ctx.fillStyle = '#e94560';
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

    // snake
    snake.forEach((seg, i) => {
      const brightness = i === 0 ? '#4ecca3' : 'hsl(160, 60%, ' + Math.max(25, 55 - i * 1.5) + '%)';
      ctx.fillStyle = brightness;
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  document.addEventListener('keydown', function (e) {
    const key = e.key;

    if (!alive) {
      if (key === 'Enter' || key === ' ') {
        init();
      }
      return;
    }

    let nd = null;
    if (key === 'ArrowUp' || key === 'w' || key === 'W') nd = { x: 0, y: -1 };
    else if (key === 'ArrowDown' || key === 's' || key === 'S') nd = { x: 0, y: 1 };
    else if (key === 'ArrowLeft' || key === 'a' || key === 'A') nd = { x: -1, y: 0 };
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') nd = { x: 1, y: 0 };

    if (nd) {
      // prevent 180° turn
      if (nd.x !== -dir.x || nd.y !== -dir.y) {
        nextDir = nd;
      }
      e.preventDefault();
    }
  });

  init();
  draw();
})();
</script>
</body>
</html>
